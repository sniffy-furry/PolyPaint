name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # The Gradle wrapper jar isn't committed to this repo (it's a binary
      # file), so it's generated fresh on every run using the Gradle
      # version installed above. Everything after this step uses ./gradlew
      # as normal.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polypaint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
