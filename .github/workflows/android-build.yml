name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships with an Android SDK (cmdline-tools)
      # pre-installed at $ANDROID_HOME. We used to set it up via
      # android-actions/setup-android@v3, but with no explicit `packages`
      # input that action's last step always runs `sdkmanager tools` -
      # installing the legacy standalone "tools" package, which Google
      # removed from the SDK repository years ago. That failed the whole
      # job. This step just makes sure licenses are accepted on the
      # SDK that's already there; Gradle/AGP auto-download whatever
      # specific platform/build-tools the build itself needs.
      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools - relying on Gradle's own SDK auto-download."
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # The Gradle wrapper jar isn't committed to this repo (it's a binary
      # file), so it's generated fresh on every run using the Gradle
      # version installed above. Everything after this step uses ./gradlew
      # as normal.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: polypaint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
